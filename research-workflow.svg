<svg xmlns="http://www.w3.org/2000/svg" width="800" height="252" viewBox="0 0 800 252" role="img" aria-labelledby="title description">
<title id="title">Does dietary recall add value for T2D follow-up?</title>
<desc id="description">Compare dietary, non-dietary and combined inputs for type 2 diabetes follow-up prioritisation. Fit and compare models, select alert thresholds on validation data and assess follow-up workload, precision and recall on held-out data.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif}.label{fill:#145c55;font-size:12px;font-weight:700;letter-spacing:1px}.heading{fill:#132c3a;font-size:30px;font-weight:700}.card{fill:#132c3a;font-size:15px;font-weight:700}.body{fill:#304d5a;font-size:14px}
</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#347c76"/></marker></defs>
<rect x="1" y="1" width="798" height="250" rx="17" fill="#f3f8f8" stroke="#afc9c7"/>
<text x="32" y="37" class="label">NHANES  /  TYPE 2 DIABETES</text>
<text x="32" y="77" class="heading">Does dietary recall add value for T2D follow-up?</text>
<g fill="none" stroke="#347c76" stroke-width="2" marker-end="url(#arrow)"><path d="M208 164H218"/><path d="M395 164H405"/><path d="M582 164H592"/></g>
<g transform="translate(32 110)">
<rect width="175" height="108" rx="12" fill="#dcefeb" stroke="#afc9c7"/>
<text x="16" y="25" class="label">01 / INPUTS</text>
<text x="16" y="51" class="card">Compare input sets</text>
<text x="16" y="75" class="body">Dietary, non-dietary</text>
<text x="16" y="93" class="body">and combined</text>
</g>
<g transform="translate(219 110)">
<rect width="175" height="108" rx="12" fill="#fff" stroke="#afc9c7"/>
<text x="16" y="25" class="label">02 / MODELLING</text>
<text x="16" y="51" class="card">Fit and compare</text>
<text x="16" y="75" class="body">Gradient boosting</text>
<text x="16" y="93" class="body">and logistic regression</text>
</g>
<g transform="translate(406 110)">
<rect width="175" height="108" rx="12" fill="#fff" stroke="#afc9c7"/>
<text x="16" y="25" class="label">03 / THRESHOLDS</text>
<text x="16" y="51" class="card">Select alert thresholds</text>
<text x="16" y="75" class="body">Use validation data</text>
</g>
<g transform="translate(593 110)">
<rect width="175" height="108" rx="12" fill="#fff" stroke="#afc9c7"/>
<text x="16" y="25" class="label">04 / EVALUATION</text>
<text x="16" y="51" class="card">Assess workload</text>
<text x="16" y="75" class="body">Precision and recall</text>
<text x="16" y="93" class="body">on held-out data</text>
</g>
</svg>
